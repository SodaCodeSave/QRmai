name: Build and Release

on:
  push:
    paths:
      - 'version.txt'
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # 获取所有历史记录以获取提交信息

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    # ===== 从 MSYS2 获取 DLL =====
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-libiconv
          mingw-w64-x86_64-zbar
          mingw-w64-x86_64-ntldd

    - name: Fetch DLLs from MSYS2
      shell: msys2 {0}
      run: |
        set -e
        mkdir -p packaging

        # 1) libiconv：同时提供 libiconv-2.dll 和 libiconv.dll 两个名字
        #    - libiconv-2.dll 是 libzbar-0.dll 内部写死的依赖名
        #    - libiconv.dll   是项目代码（ctypes）期望的名字
        cp /mingw64/bin/libiconv-2.dll  packaging/libiconv-2.dll
        cp /mingw64/bin/libiconv-2.dll  packaging/libiconv.dll
        if [ -f /mingw64/bin/libcharset-1.dll ]; then
          cp /mingw64/bin/libcharset-1.dll packaging/
        fi

        # 2) libzbar：项目期望的名字是 libzbar-64.dll
        cp /mingw64/bin/libzbar-0.dll packaging/libzbar-64.dll

        # 3) 递归抓取 libzbar-0.dll 的所有 mingw64 依赖
        ntldd -R /mingw64/bin/libzbar-0.dll \
          | grep -oP 'mingw64\\bin\\\K[^ ]+\.dll' \
          | sort -u \
          | while read -r dll; do
              if [ -f "/mingw64/bin/$dll" ]; then
                cp -n "/mingw64/bin/$dll" packaging/
              fi
            done

        echo "=== packaging 目录内容 ==="
        ls -l packaging/

    - name: Verify required DLL files
      shell: pwsh
      run: |
        $required = @(
          "packaging/libiconv.dll",
          "packaging/libzbar-64.dll"
        )
        foreach ($f in $required) {
          if (Test-Path $f -PathType Leaf) {
            $size = (Get-Item $f).Length
            if ($size -eq 0) {
              Write-Error "File is empty: $f"
              exit 1
            }
            Write-Host "OK: $f ($([math]::Round($size/1KB,2)) KB)"
          } else {
            Write-Error "Missing: $f"
            exit 1
          }
        }
    # ===== MSYS2 部分结束 =====

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Read version from version.txt
      run: |
        $version = Get-Content -Path version.txt -Raw | ForEach-Object { $_.Trim() }
        echo "VERSION=$version" >> $env:GITHUB_ENV
        echo "Version detected: $version"
      shell: pwsh

    - name: Verify version format
      run: |
        $version = $env:VERSION
        if ($version -match "^v\d+\.\d+\.\d+(-alpha|-beta)?") {
          echo "Version format is valid: $version"
        } else {
          echo "Invalid version format: $version"
          exit 1
        }
      shell: pwsh

    - name: Run build script
      run: |
        # Set Python to use UTF-8 encoding
        $env:PYTHONIOENCODING = "utf-8"
        python -c "import sys; print('Python version:', sys.version); print('Default encoding:', sys.getdefaultencoding())"
        python packaging/build_exe.py

    # ===== 冒烟测试：确认 exe 能启动（缺 DLL 会立刻挂）=====
    - name: Smoke test the exe
      shell: pwsh
      run: |
        $exe = "dist\QRmai.exe"
        if (-Not (Test-Path $exe)) {
          Write-Error "Exe not found: $exe"
          exit 1
        }
        $p = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden
        Start-Sleep -Seconds 8
        if ($p.HasExited) {
          Write-Error "Exe exited early with code $($p.ExitCode) - likely missing DLLs"
          exit 1
        }
        Stop-Process -Id $p.Id -Force
        Write-Host "Smoke test passed: exe is running"
    # ===== 冒烟测试结束 =====

    - name: Prepare release assets
      run: |
        # 检查构建结果
        if (-Not (Test-Path "dist/QRmai.exe")) {
          echo "Error: Executable not found"
          exit 1
        }

        # 重命名生成的exe文件
        $version = $env:VERSION
        $newName = "QRmai-$version-win.exe"
        Copy-Item "dist/QRmai.exe" "dist/$newName"
        echo "Renamed executable to: $newName"

        # 验证重命名的文件
        if (Test-Path "dist/$newName") {
          $size = (Get-Item "dist/$newName").Length
          echo "File size: $([math]::Round($size / 1MB, 2)) MB"
        } else {
          echo "Error: Rename failed"
          exit 1
        }
      shell: pwsh

    - name: Get commit messages since last release
      run: |
        $lastTag = git describe --tags --abbrev=0 2>$null
        if ($lastTag) {
            $commits = git log --oneline --no-merges "$lastTag..HEAD"
        } else {
            $commits = git log --oneline --no-merges
        }
        # Convert to markdown unordered list
        $commitList = $commits -split "`n" | Where-Object { $_ -ne "" } | ForEach-Object { "- $_" }
        $commitList = $commitList -replace '"', '""'  # 转义双引号
        echo "COMMIT_MESSAGES<<EOF" >> $env:GITHUB_ENV
        $commitList | ForEach-Object { echo "$_" >> $env:GITHUB_ENV }
        echo "EOF" >> $env:GITHUB_ENV
      shell: pwsh

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ env.VERSION }}
        name: ${{ env.VERSION }}
        body: |
          在使用之前，你可能需要准备 [Visual C++ Redistributable Packages for Visual Studio 2013](https://www.microsoft.com/en-us/download/details.aspx?id=40784) 环境

          更新简介:
          ${{ env.COMMIT_MESSAGES }}

          ${{ contains(env.VERSION, '-alpha') && '⚠️ 这是一个Alpha测试版本 未经过测试 不建议使用' || contains(env.VERSION, '-beta') && '⚠️ 这是一个Beta测试版本 已经经过测试 但仍不建议使用' || '' }}
        files: |
          dist/QRmai-${{ env.VERSION }}-win.exe
        draft: false
        prerelease: ${{ contains(env.VERSION, '-alpha') || contains(env.VERSION, '-beta') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}